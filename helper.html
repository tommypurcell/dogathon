<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Paws &amp; Co. — Talk to our Office Helper</title>
  <style>
    :root {
      --blue-bg-1: #cfe6ff;
      --blue-bg-2: #a9d1ff;
      --ink: #17324d;
      --accent: #2f6fed;
      --accent-dark: #1e4fb0;
      --card: #ffffff;
      --ok: #22c07a;
      --danger: #ef4a5a;
      --ring: rgba(47, 111, 237, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(120% 120% at 50% 0%, var(--blue-bg-1), var(--blue-bg-2));
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 28px;
      padding: 32px 28px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(23, 50, 77, 0.18), 0 2px 6px rgba(23,50,77,.08);
    }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    h1 { font-size: 24px; font-weight: 800; margin-top: 6px; line-height: 1.2; }
    .subtitle { color:#6a819b; font-size: 14px; margin-top: 6px; }

    /* Avatar */
    .avatar-wrap { position: relative; width: 220px; height: 220px; margin: 26px auto 8px; }
    .avatar-ring {
      position: absolute; inset: -10px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), #7aa7ff, var(--accent));
      opacity: 0; transition: opacity .3s ease;
      animation: spin 6s linear infinite;
    }
    .avatar-glow {
      position: absolute; inset: -18px; border-radius: 50%;
      box-shadow: 0 0 0 0 var(--ring);
      transition: box-shadow .2s ease;
    }
    .avatar {
      position: absolute; inset: 0;
      width: 220px; height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid #fff;
      background: linear-gradient(180deg, var(--blue-bg-1), var(--blue-bg-2));
      box-shadow: 0 10px 30px rgba(23,50,77,.25);
      z-index: 1;
    }
    /* States */
    body[data-state="speaking"] .avatar-ring { opacity: 1; }
    body[data-state="speaking"] .avatar-glow { box-shadow: 0 0 40px 8px var(--ring); }
    body[data-state="listening"] .avatar-glow { box-shadow: 0 0 34px 4px rgba(34,192,122,.4); }
    body[data-state="thinking"] .avatar { animation: bob 1.2s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }

    .name { font-size: 20px; font-weight: 800; margin-top: 14px; }
    .status {
      display: inline-block; margin-top: 6px; font-size: 14px; font-weight: 600;
      color: var(--accent-dark);
      min-height: 20px;
    }

    .talk-btn {
      margin-top: 22px;
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 16px; font-weight: 700;
      color: #fff;
      background: var(--accent);
      box-shadow: 0 8px 20px rgba(47,111,237,.35), inset 0 1px 0 rgba(255,255,255,.25);
      cursor: pointer;
      transition: transform .08s ease, background .2s ease, opacity .2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .talk-btn:active { transform: scale(.98); }
    .talk-btn.end { background: var(--danger); box-shadow: 0 8px 20px rgba(239,74,90,.35), inset 0 1px 0 rgba(255,255,255,.25); }
    .talk-btn:disabled { opacity: .6; cursor: default; }

    .hint { margin-top: 14px; font-size: 12px; color: #8aa0b8; line-height: 1.5; }
    .hint b { color: #6a819b; }
    .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }
  </style>
</head>
<body data-state="idle">
  <main class="card">
    <div class="brand">Paws &amp; Co. Adoptions</div>
    <h1>Talk to our Office Helper</h1>
    <p class="subtitle">Ask about our dogs or book a viewing — just talk!</p>

    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar-glow"></div>
      <!-- Drop your dog image at web/assets/dog.png -->
      <img class="avatar" src="assets/dog.png" alt="Office Helper, a friendly golden retriever with a headset"
           onerror="this.style.background='linear-gradient(180deg,#cfe6ff,#a9d1ff)'; this.alt='(place dog.png in web/assets/)';" />
    </div>

    <div class="name">Buddy · Office Helper</div>
    <div class="status" id="status">Tap to start talking</div>

    <button class="talk-btn" id="talkBtn">
      <span id="btnIcon">🎙️</span><span id="btnLabel">Start talking</span>
    </button>

    <div class="err" id="err"></div>
    <p class="hint">
      Try: <b>“I'm looking for a good family dog — what do you have?”</b><br/>
      or <b>“I'm interested in Max — when can I come see him?”</b>
    </p>
  </main>

  <!-- Fully self-contained: browser speech in, mock brain, browser speech out. -->
  <script src="app.js"></script>
</body>
</html>
